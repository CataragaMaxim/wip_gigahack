name: Flux oficial — apă și energie electrică

# Preia deconectările de pe https://acc.md/disconnections (apă) și
# https://www.premierenergydistribution.md/ro/toate-lucrarile-programate (energie electrică)
# și le scrie în Firestore (`events`, feed „live”). Cele două surse rulează ca job-uri separate: una nu o blochează pe cealaltă.
# Necesită secretul FIREBASE_SERVICE_ACCOUNT (JSON-ul unui cont de serviciu cu rol „Cloud Datastore User”).

on:
  schedule:
    # O dată pe oră (la minutul 7, nu la :00, când GitHub e cel mai aglomerat și întârzie rulările).
    - cron: '7 * * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Doar citire (nu scrie în Firestore)'
        type: boolean
        default: false

concurrency:
  group: acc-outages
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  acc:
    name: Apă (Apă-Canal Chișinău)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: scripts/acc_outages/requirements.txt
      - run: pip install -r scripts/acc_outages/requirements.txt
      # Geocodarea fiecărei adrese se păstrează între rulări: doar adresele noi se caută.
      - uses: actions/cache/restore@v4
        with:
          path: .geocache
          key: geocache-acc-${{ github.run_id }}
          restore-keys: geocache-acc-
      - name: Sincronizare
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          GEOCACHE_PATH: .geocache/geocache.json
        run: |
          python scripts/acc_outages/sync_acc.py --out acc-events.json ${{ inputs.dry_run && '--dry-run' || '' }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: acc-events
          path: acc-events.json
          retention-days: 3
          if-no-files-found: ignore
      - uses: actions/cache/save@v4
        if: always()
        with:
          path: .geocache
          key: geocache-acc-${{ github.run_id }}

  premier:
    name: Energie electrică (Premier Energy Distribution)
    runs-on: ubuntu-latest
    # Site-ul răspunde în 20–60 s pe pagină; prima rulare geocodează ~600 de adrese (max. 700/rulare, restul la următoarele).
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: scripts/acc_outages/requirements.txt
      - run: pip install -r scripts/acc_outages/requirements.txt
      # Geocodarea fiecărei adrese se păstrează între rulări: doar adresele noi se caută.
      - uses: actions/cache/restore@v4
        with:
          path: .geocache
          key: geocache-premier-${{ github.run_id }}
          restore-keys: geocache-premier-
      - name: Sincronizare
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          GEOCACHE_PATH: .geocache/geocache.json
        run: |
          python scripts/acc_outages/sync_premier.py --out premier-events.json ${{ inputs.dry_run && '--dry-run' || '' }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: premier-events
          path: premier-events.json
          retention-days: 3
          if-no-files-found: ignore
      - uses: actions/cache/save@v4
        if: always()
        with:
          path: .geocache
          key: geocache-premier-${{ github.run_id }}
