name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  telegram-bot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: telegram-bot/requirements.txt
      - run: python -m pip install -r telegram-bot/requirements.txt
      - run: python -m compileall -q telegram-bot
      - name: Build bot application without network calls
        env:
          BOT_TOKEN: ci-placeholder-token
        run: PYTHONPATH=telegram-bot python -c "from bot.app import build_app; app = build_app(); assert app"

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run check:i18n
      - run: npm run typecheck
      - run: npm run build
